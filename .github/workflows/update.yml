name: Update surf calendar

on:
  schedule:
    - cron: "17 5,11,17 * * *"   # 3x a day (UTC); forecasts change slowly, be gentle with the site
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      # one <id>.ics per spot + all.ics + best.ics
      - run: python surf_calendar.py --spot-id 1280 1282 1283 1284 1285 1286 1289 1290 1291
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
